# Get editor completions based on the config schema
"$schema" = "https://starship.rs/config-schema.json"

# Two-line prompt. No Nerd Fonts — Ghostty uses Google Sans Code.
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$cmd_duration\
$line_break\
$character"""

right_format = """
$c\
$golang\
$nodejs\
$bun\
$python\
$rust\
$jobs\
$status\
$time"""

add_newline = true
palette = "catppuccin_latte"

[palettes.catppuccin_latte]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay0 = "#9ca0b1"
surface2 = "#acb0be"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"

[username]
show_always = false
format = "[$user]($style)@"
style_user = "green"
style_root = "bold red"

[hostname]
ssh_only = false
format = "[\\[$hostname\\]]($style) "
style = "green"

[directory]
style = "bold blue"
truncation_length = 5
truncate_to_repo = false
format = "in [$path]($style)[$read_only]($read_only_style) "
read_only = " ro"
home_symbol = "~"

[git_branch]
symbol = ""
style = "mauve"
format = "on [$branch]($style) "

[git_commit]
only_detached = true
tag_disabled = false
commit_hash_length = 7
format = "[\\($hash$tag\\)]($style) "

[git_status]
style = "red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[git_metrics]
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "green"
deleted_style = "red"

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "yellow"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "yellow"

[time]
disabled = false
format = "[$time]($style)"
style = "overlay2"
time_format = "%H:%M"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](peach)"

[status]
disabled = false
format = "[$status]($style) "
style = "red"

[jobs]
number_threshold = 1
format = "[jobs $number]($style) "
style = "peach"

[nodejs]
format = "[node $version](green) "
detect_files = ["package.json", ".node-version", ".nvmrc"]

[bun]
format = "[bun $version](green) "

[python]
format = "[py ${version}( $virtualenv)](yellow) "

[rust]
format = "[rs $version](peach) "

[golang]
format = "[go $version](sky) "

[c]
format = "[c $version](overlay2) "

[aws]
disabled = true

[os]
disabled = true

[localip]
disabled = true
